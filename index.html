   for(const a of geom){

async function ocrHighlight(ref,p,canvas,layer){

 try{
  const ok=await initOCR();
  if(!ok){toast(t("ocrNo",ref));return}
  $("status").textContent=t("ocrPrep",ref,p,total);

  // Re-render the PDF page at high resolution only for OCR.
  // This is independent of the smaller on-screen canvas.
  const srcItems=pageTextItems[p]||[];
  const scaleFactor=3.6;
  // Reuse current PDF viewport geometry to create a high-res copy of the displayed page.
  const baseVp=pageViewports[p];
  const hiScale=scaleFactor;
  hi=document.createElement("canvas");
  hi.width=Math.round(canvas.width*hiScale);
  hi.height=Math.round(canvas.height*hiScale);

  hctx.imageSmoothingEnabled=true;
  hctx.imageSmoothingQuality="high";
  hctx.drawImage(canvas,0,0,hi.width,hi.height);

  // Increase local contrast for thin schematic lettering.
  try{
   let im=hctx.getImageData(0,0,hi.width,hi.height),d=im.data;
   for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];

   }
   hctx.putImageData(im,0,0);
  }catch(e){}

  const compact=t=>normalizeRef(t||"").replace(/[^A-Z0-9]/g,"");
  const target=compact(ref);
  const variants=new Set([target]);

  variants.add(target.replace(/O/g,"0")); variants.add(target.replace(/0/g,"O"));

  variants.add(target.replace(/S/g,"5")); variants.add(target.replace(/5/g,"S"));

  const result=await OCR.recognize(hi,"eng",{
   logger:m=>{if(m.status==="recognizing text"&&typeof m.progress==="number")
    $("status").textContent=t("ocrProg",ref,Math.round(m.progress*100));}
  });

  const words=(result.data&&result.data.words)||[];
  let candidates=[];
  function scoreText(txt){
   let z=compact(txt); if(!z)return 0;
   if(variants.has(z))return 100;
   if(z.includes(target)||target.includes(z))return 82;

   if(Math.abs(z.length-target.length)<=1){

   }
  });

   toast(t("ocrNFt",ref,p));
   return;
  }

  document.querySelectorAll(".refMark").forEach(m=>m.remove());
  const c=candidates[0],boxes=c.words.map(w=>w.bbox);
  let l=Math.min(...boxes.map(b=>b.x0))/hiScale,t=Math.min(...boxes.map(b=>b.y0))/hiScale,

let _db=null;function idb(){return _db||(_db=new Promise((ok,bad)=>{try{let r=indexedDB.open("aheaseLib",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)}catch(e){bad(e)}}))}
async function dbPut(k,v){try{let d=await idb();d.transaction("f","readwrite").objectStore("f").put(v,k)}catch(e){}}
async function dbDel(k){try{let d=await idb();d.transaction("f","readwrite").objectStore("f").delete(k)}catch(e){}}
async function dbGet(k){try{let d=await idb();return await new Promise(ok=>{let r=d.transaction("f").objectStore("f").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}
